<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For Idalina 💕</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
<body>

  <div id="floatingHearts"></div>

  <!-- ENVELOPE INTRO -->
  <section id="envelopeScreen" class="envelope-screen">

    <div class="envelope-wrapper">

      <div class="envelope-icon">
        💌
      </div>

      <p class="envelope-small">
        A LITTLE SOMETHING
      </p>

      <h1 class="envelope-title">
        For Idalina
      </h1>

      <p class="envelope-message">
        I made something for you.
      </p>

      <button id="openLetterButton">
        Open me 💗
      </button>

    </div>

  </section>


  <!-- MAIN WEBSITE -->
  <main class="container hidden" id="mainWebsite">

    <div class="card" id="card">

      <p class="small-title">A LITTLE SOMETHING</p>

      <h1>Hey, Idalina 💕</h1>

      <p class="message">
        I made you something small...
        because apparently just asking normally felt a little too boring.
      </p>

      <button id="nextButton">
        Okayyy 👀
      </button>

    </div>

    <div class="progress">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
